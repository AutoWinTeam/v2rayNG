name: Build x86_64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Bump version
      run: |
        cd ${{ github.workspace }}/V2rayNG/app
        BASE_CODE=$(grep -oP 'versionCode = \K[0-9]+' build.gradle.kts)
        BASE_NAME=$(grep -oP 'versionName = "\K[^"]+' build.gradle.kts)
        NEW_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
        NEW_NAME="${BASE_NAME}.${GITHUB_RUN_NUMBER}"
        sed -i "s/versionCode = ${BASE_CODE}/versionCode = ${NEW_CODE}/" build.gradle.kts
        sed -i "s/versionName = \"${BASE_NAME}\"/versionName = \"${NEW_NAME}\"/" build.gradle.kts
        echo "Version: $BASE_NAME ($BASE_CODE) -> $NEW_NAME ($NEW_CODE)"
        echo "APP_VERSION=${NEW_NAME}" >> $GITHUB_ENV

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build x86_64 release APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -PABI_FILTERS=x86_64 \
          -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
          -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Rename APK to moonVPN_x86_64.apk
      run: |
        APK=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk -name '*x86_64*.apk' | head -n 1)
        if [ -z "$APK" ]; then
          echo "No x86_64 APK found"
          exit 1
        fi
        echo "Found APK: $APK"
        mkdir -p ${{ github.workspace }}/out
        cp "$APK" ${{ github.workspace }}/out/moonVPN_x86_64.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v7
      with:
        name: moonVPN-x86_64
        path: ${{ github.workspace }}/out/moonVPN_x86_64.apk

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.APP_VERSION }}
        name: moonVPN v${{ env.APP_VERSION }}
        body: |
          moonVPN ${{ env.APP_VERSION }} (x86_64, release)

          Commit: ${{ github.sha }}
        files: ${{ github.workspace }}/out/moonVPN_x86_64.apk
